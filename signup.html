<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="BookSwap: buy and sell used university books">
    <title>BookSwap - Sign up</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <style type="text/css">
        form { text-align: center; }
    </style>
    <script src="js/script.js"></script>
    <script>
        function validateSignup() {
            var name = document.forms["signupForm"]["name"].value;
            var email = document.forms["signupForm"]["email"].value;
            var major = document.forms["signupForm"]["major"].value;
            var password = document.forms["signupForm"]["password"].value;
            var password2 = document.forms["signupForm"]["password2"].value;
            var message = document.getElementById("signupMessage");
            var errors = 0;

            if (name == "") {
                showError("name", "Please enter your name");
                errors++;
            } else {
                showRight("name");
            }

            if (email == "") {
                showError("email", "Please enter your email");
                errors++;
            } else {
                showRight("email");
            }

            if (major == "") {
                showError("major", "Please choose your major");
                errors++;
            } else {
                showRight("major");
            }

            if (password == "") {
                showError("password", "Please enter a password");
                errors++;
            } else {
                showRight("password");
            }

            if (password2 == "") {
                showError("password2", "Please confirm your password");
                errors++;
            } else if (password2 != password) {
                showError("password2", "The passwords are not the same");
                errors++;
            } else {
                showRight("password2");
            }

            if (errors == 0) {
                message.innerHTML = "Welcome " + name + "! Your account is ready.";
                message.style.color = "green";
            } else {
                message.innerHTML = "You have " + errors + " error(s), please fix them";
                message.style.color = "red";
            }
            return false;
        }

        function clearSignup() {
            resetField("name");
            resetField("email");
            resetField("major");
            resetField("password");
            resetField("password2");
            document.getElementById("signupMessage").innerHTML = "";
        }
    </script>
</head>
<body>

    <header id="top">
        <h1>BookSwap</h1>
        <nav>
            Menu
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About us</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="signup.html">Sign up</a></li>
            </ul>
        </nav>
    </header>

    <div class="content">

        <div class="banner">
            <img src="images/banner.png" width="600" height="180" alt="BookSwap" usemap="#bookmap">
            <map name="bookmap">
                <area shape="rect" coords="440,120,580,165" href="about.html" alt="About us">
            </map>
        </div>

        <section class="box">
            <h2 style="text-align: center;">Sign up</h2>
            <form name="signupForm" onsubmit="return validateSignup()" onreset="clearSignup()">
                <p>
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name" class="field" onfocus="highlight(this)" onblur="normal(this)"><br>
                    <span id="nameError" class="error"></span>
                </p>
                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" class="field" onfocus="highlight(this)" onblur="normal(this)"><br>
                    <span id="emailError" class="error"></span>
                </p>
                <p>
                    <label for="major">Major:</label><br>
                    <select id="major" name="major" class="field">
                        <option value="">-- Choose --</option>
                        <option>Information Systems</option>
                        <option>Computer Science</option>
                        <option>Information Technology</option>
                    </select><br>
                    <span id="majorError" class="error"></span>
                </p>
                <p>
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password" class="field" onfocus="highlight(this)" onblur="normal(this)"><br>
                    <span id="passwordError" class="error"></span>
                </p>
                <p>
                    <label for="password2">Confirm password:</label><br>
                    <input type="password" id="password2" name="password2" class="field" onfocus="highlight(this)" onblur="normal(this)"><br>
                    <span id="password2Error" class="error"></span>
                </p>
                <p>
                    <input type="submit" class="button" value="Sign up">
                    <input type="reset" class="button" value="Clear">
                </p>
            </form>
            <p id="signupMessage" style="text-align: center;"></p>
            <p>Have an account? <a href="login.html">Login</a></p>
        </section>

        <p><a href="index.html">Back to home</a></p>
    </div>

</body>
</html>
