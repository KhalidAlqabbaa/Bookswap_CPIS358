<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="BookSwap: buy and sell used university books">
    <title>BookSwap - Login</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <style type="text/css">
        form { text-align: center; }
    </style>
    <script src="js/script.js"></script>
    <script>
        function validateLogin() {
            var email = document.forms["loginForm"]["email"].value;
            var password = document.forms["loginForm"]["password"].value;
            var message = document.getElementById("loginMessage");
            var errors = 0;

            if (email == "") {
                showError("email", "Please enter your email");
                errors++;
            } else {
                showRight("email");
            }

            if (password == "") {
                showError("password", "Please enter your password");
                errors++;
            } else {
                showRight("password");
            }

            if (errors == 0) {
                message.innerHTML = "Welcome back " + email + "!";
                message.style.color = "green";
            } else {
                message.innerHTML = "Please fix the errors above";
                message.style.color = "red";
            }
            return false;
        }

        function clearLogin() {
            resetField("email");
            resetField("password");
            document.getElementById("loginMessage").innerHTML = "";
        }
    </script>
</head>
<body>

    <header id="top">
        <h1>BookSwap</h1>
        <nav>
            Menu
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About us</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="signup.html">Sign up</a></li>
            </ul>
        </nav>
    </header>

    <div class="content">

        <div class="banner">
            <img src="images/banner.png" width="600" height="180" alt="BookSwap" usemap="#bookmap">
            <map name="bookmap">
                <area shape="rect" coords="440,120,580,165" href="about.html" alt="About us">
            </map>
        </div>

        <section class="box">
            <h2 style="text-align: center;">Login</h2>
            <form name="loginForm" onsubmit="return validateLogin()" onreset="clearLogin()">
                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" class="field" onfocus="highlight(this)" onblur="normal(this)"><br>
                    <span id="emailError" class="error"></span>
                </p>
                <p>
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password" class="field" onfocus="highlight(this)" onblur="normal(this)"><br>
                    <span id="passwordError" class="error"></span>
                </p>
                <p>
                    <input type="submit" class="button" value="Login">
                    <input type="reset" class="button" value="Clear">
                </p>
            </form>
            <p id="loginMessage" style="text-align: center;"></p>
            <p>No account? <a href="signup.html">Sign up</a></p>
        </section>

        <p><a href="index.html">Back to home</a></p>
    </div>

</body>
</html>
